[project]
name = "content-zavod"
version = "0.1.0"
description = "Генерация контент-планов и статей для медиаплощадок через Telegram-бота"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "apscheduler>=3.10",
    "asyncpg>=0.29",
    "httpx>=0.28.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_zavod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
