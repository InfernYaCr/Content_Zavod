[project]
name = "content-zavod"
version = "0.1.0"
description = "Генерация контент-планов и статей для медиаплощадок через Telegram-бота"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "apscheduler>=3.10",
    "asyncpg>=0.29",
    "httpx>=0.28.1",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.16.0",
    "testcontainers>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_zavod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # Russian prose intentionally uses Cyrillic lookalikes.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
